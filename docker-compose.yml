services:
  postgres:
    image: postgres:18-alpine
    container_name: mailupdater-db
    environment:
      POSTGRES_USER: mailupdater
      POSTGRES_PASSWORD: mailupdater123
      POSTGRES_DB: mailupdater
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mailupdater" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
